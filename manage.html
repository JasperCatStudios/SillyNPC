<div class="sillynpc sillynpc-manage">
    <div class="sillynpc-manage-layout">
        <div class="sillynpc-tabs" role="tablist">
        <div id="sillynpc-settings-search"></div>
        <button type="button" class="sillynpc-tab active" data-tab="characters" role="tab">
            <i class="fa-solid fa-users"></i> <span>Characters</span>
        </button>
        <button type="button" class="sillynpc-tab" data-tab="modules" role="tab">
            <i class="fa-solid fa-puzzle-piece"></i> <span>Modules</span>
        </button>
        <button type="button" class="sillynpc-tab" data-tab="appearance" role="tab">
            <i class="fa-solid fa-palette"></i> <span>Appearance</span>
        </button>
        <button type="button" class="sillynpc-tab" data-tab="writing" role="tab">
            <i class="fa-solid fa-pen-nib"></i> <span>Writing Rules</span>
        </button>
        <button type="button" class="sillynpc-tab" data-tab="threads" role="tab">
            <i class="fa-solid fa-list-check"></i> <span>Threads</span>
        </button>
        <button type="button" class="sillynpc-tab" data-tab="status" role="tab">
            <i class="fa-solid fa-heart-pulse"></i> <span>Tracker</span>
        </button>
        <button type="button" class="sillynpc-tab" data-tab="systems" role="tab">
            <i class="fa-solid fa-screwdriver-wrench"></i> <span>Systems</span>
        </button>
        <button type="button" class="sillynpc-tab" data-tab="connections" role="tab">
            <i class="fa-solid fa-plug"></i> <span>Connections</span>
        </button>
        <button type="button" class="sillynpc-tab" data-tab="vectors" role="tab">
            <i class="fa-solid fa-diagram-project"></i> <span>Vectors</span>
        </button>
        <button type="button" class="sillynpc-tab" data-tab="prompts" role="tab">
            <i class="fa-solid fa-feather-pointed"></i> <span>Prompts</span>
        </button>
        <button type="button" class="sillynpc-tab" data-tab="advanced" role="tab">
            <i class="fa-solid fa-gear"></i> <span>Advanced</span>
        </button>
    </div>

    <div class="sillynpc-tab-panel" data-panel="characters">
        <div id="sillynpc-grid-view">
            <div class="sillynpc-card-grid" id="sillynpc-card-grid"></div>
        </div>
        <div id="sillynpc-editor-view" style="display: none;"></div>
    </div>

    <div class="sillynpc-tab-panel" data-panel="modules" style="display: none;">
        <div id="sillynpc-modules-view"></div>
    </div>

    <div class="sillynpc-tab-panel" data-panel="appearance" style="display: none;">
        <div id="sillynpc-appearance-view"></div>
    </div>

    <div class="sillynpc-tab-panel" data-panel="writing" style="display: none;">
        <div id="sillynpc-writing-view"></div>
    </div>

    <div class="sillynpc-tab-panel" data-panel="threads" style="display: none;">
        <div id="sillynpc-threads-view"></div>
    </div>

    <div class="sillynpc-tab-panel" data-panel="status" style="display: none;">
        <div id="sillynpc-status-view"></div>
    </div>

    <div class="sillynpc-tab-panel" data-panel="systems" style="display: none;">
        <div id="sillynpc-systems-view"></div>
    </div>

    <div class="sillynpc-tab-panel" data-panel="connections" style="display: none;">
        <div id="sillynpc-connections-view"></div>
    </div>

    <div class="sillynpc-tab-panel" data-panel="vectors" style="display: none;">
        <div id="sillynpc-vectors-view"></div>
    </div>

    <div class="sillynpc-tab-panel" data-panel="prompts" style="display: none;">
        <div id="sillynpc-prompts-view"></div>
    </div>

    <div class="sillynpc-tab-panel" data-panel="advanced" style="display: none;">
        <div id="sillynpc-advanced-view"></div>
    </div>
    </div>
</div>
